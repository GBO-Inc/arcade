name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run. On main every commit gets
# its own group, so no merge's run is ever cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Detect Gradle project
        id: project
        run: |
          if [ -f build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No backend/build.gradle.kts yet (SCRUM-18), backend checks skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.project.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        if: steps.project.outputs.exists == 'true'

      # build = compile, unit tests, integration tests, check (Spotless) and the
      # JaCoCo report. Called through sh because a wrapper committed from Windows
      # can lose its executable bit.
      - name: Build, format check, tests and coverage
        if: steps.project.outputs.exists == 'true'
        run: sh ./gradlew build

      # JaCoCo CSV columns 4-9: instruction, branch and line counts (missed, covered).
      - name: Publish JaCoCo coverage summary
        if: steps.project.outputs.exists == 'true' && always()
        run: |
          CSV_FILE="build/reports/jacoco/test/jacocoTestReport.csv"
          if [ -f "$CSV_FILE" ]; then
            awk -F',' '
              function row(name, missed, covered,   total) {
                total = missed + covered
                printf "| %s | %d | %d | **%.2f%%** |\n", name, covered, total, (total > 0 ? covered / total * 100 : 0)
              }
              NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
              END {
                print "### Backend Test Coverage (JaCoCo)\n"
                print "| Metric | Covered | Total | Coverage |"
                print "| :--- | :---: | :---: | :---: |"
                row("Instructions", im, ic)
                row("Branches", bm, bc)
                row("Lines", lm, lc)
              }
            ' "$CSV_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "JaCoCo CSV report not found at $CSV_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Detect TypeScript project
        id: project
        run: |
          if [ -f tsconfig.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No frontend/tsconfig.json yet (SCRUM-22), frontend checks skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.project.outputs.exists == 'true'
        run: npm run typecheck

      - name: Unit tests with coverage
        if: steps.project.outputs.exists == 'true'
        run: npm run test:coverage

      - name: Production build
        if: steps.project.outputs.exists == 'true'
        run: npm run build
