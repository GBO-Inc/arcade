name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Detect Gradle project
        id: project
        run: |
          if [ -f build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No backend/build.gradle.kts yet (SCRUM-18), backend checks skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.project.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        if: steps.project.outputs.exists == 'true'

      - name: Build, format check, tests and coverage
        if: steps.project.outputs.exists == 'true'
        run: sh ./gradlew build

      - name: Publish JaCoCo coverage summary
        if: steps.project.outputs.exists == 'true' && always()
        run: |
          CSV_FILE="build/reports/jacoco/test/jacocoTestReport.csv"
          if [ -f "$CSV_FILE" ]; then
            awk -F',' '
              NR > 1 {
                inst_missed += $4; inst_covered += $5;
                branch_missed += $6; branch_covered += $7;
                line_missed += $8; line_covered += $9;
              }
              END {
                inst_total = inst_missed + inst_covered;
                branch_total = branch_missed + branch_covered;
                line_total = line_missed + line_covered;
                inst_pct = inst_total > 0 ? (inst_covered / inst_total) * 100 : 0;
                branch_pct = branch_total > 0 ? (branch_covered / branch_total) * 100 : 0;
                line_pct = line_total > 0 ? (line_covered / line_total) * 100 : 0;
                printf "### Backend Test Coverage (JaCoCo)\n\n" >> "'"$GITHUB_STEP_SUMMARY"'"
                printf "| Metric | Covered | Total | Coverage |\n" >> "'"$GITHUB_STEP_SUMMARY"'"
                printf "| :--- | :---: | :---: | :---: |\n" >> "'"$GITHUB_STEP_SUMMARY"'"
                printf "| Instructions | %d | %d | **%.2f%%** |\n", inst_covered, inst_total, inst_pct >> "'"$GITHUB_STEP_SUMMARY"'"
                printf "| Branches | %d | %d | **%.2f%%** |\n", branch_covered, branch_total, branch_pct >> "'"$GITHUB_STEP_SUMMARY"'"
                printf "| Lines | %d | %d | **%.2f%%** |\n", line_covered, line_total, line_pct >> "'"$GITHUB_STEP_SUMMARY"'"
              }
            ' "$CSV_FILE"
          else
            echo "JaCoCo CSV report not found at $CSV_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Detect TypeScript project
        id: project
        run: |
          if [ -f tsconfig.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No frontend/tsconfig.json yet (SCRUM-22), frontend checks skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.project.outputs.exists == 'true'
        run: npm run typecheck

      - name: Unit tests with coverage
        if: steps.project.outputs.exists == 'true'
        run: npm run test:coverage

      - name: Production build
        if: steps.project.outputs.exists == 'true'
        run: npm run build