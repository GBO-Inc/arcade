# The datasource comes from AbstractIntegrationTest. There is deliberately no fallback URL here,
# so a Spring Boot test that needs the database but does not extend it fails instead of
# quietly starting its own container in the unit test task.
# Test-only value, not used anywhere else.
arcade.jwt.secret=integration-test-secret-that-is-at-least-32-bytes
arcade.websocket.allowed-origins=http://localhost:5173
