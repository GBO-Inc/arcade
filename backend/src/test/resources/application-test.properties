# Testcontainers starts a throwaway PostgreSQL (same major version as compose.yaml) on first use.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///arcade
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# Test-only value, not used anywhere else.
arcade.jwt.secret=integration-test-secret-that-is-at-least-32-bytes
