<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif">
<title>Arcade wireframe – Result dialog (desktop)</title>

<!-- Faded match page in the background (simplified) -->
<g opacity="0.35">
<rect x="0" y="0" width="1280" height="800" fill="#020617"/>
<rect x="0" y="0" width="1280" height="64" fill="#0f172a"/>
<text x="64" y="40" font-size="20" font-weight="700" fill="#f1f5f9">Arcade</text>
<rect x="64" y="92" width="1152" height="64" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<rect x="64" y="184" width="240" height="600" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<rect x="350" y="184" width="520" height="520" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="916" y="184" width="300" height="240" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<rect x="916" y="456" width="300" height="328" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
</g>

<!-- Dark overlay -->
<rect x="0" y="0" width="1280" height="800" fill="#020617" fill-opacity="0.7"/>

<!-- Modal -->
<rect x="420" y="180" width="440" height="320" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="444" y="208" font-size="11" letter-spacing="1" fill="#64748b">RESULT DIALOG</text>
<text x="640" y="262" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="middle">You won!</text>
<text x="640" y="288" font-size="14" fill="#94a3b8" text-anchor="middle">or 'You lost' / 'Draw'</text>
<text x="640" y="330" font-size="16" fill="#cbd5e1" text-anchor="middle">Opponent resigned</text>
<rect x="460" y="356" width="360" height="56" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
<text x="640" y="390" font-size="16" font-weight="600" fill="#22c55e" text-anchor="middle">Rating 1200 → 1216 (+16)</text>
<rect x="460" y="440" width="170" height="40" rx="8" fill="#4f46e5"/>
<text x="545" y="465" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Rematch</text>
<rect x="650" y="440" width="170" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
<text x="735" y="465" font-size="14" fill="#cbd5e1" text-anchor="middle">Back to lobby</text>
</svg>
