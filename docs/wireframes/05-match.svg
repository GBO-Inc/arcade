<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif">
<title>Arcade wireframe – Match page (desktop)</title>
<rect x="0" y="0" width="1280" height="800" fill="#020617"/>
<rect x="0" y="0" width="1280" height="64" fill="#0f172a"/>
<line x1="0" y1="64" x2="1280" y2="64" stroke="#1e293b" stroke-width="1"/>
<text x="64" y="40" font-size="20" font-weight="700" fill="#f1f5f9">Arcade</text>
<text x="194" y="37" font-size="14" fill="#cbd5e1" text-anchor="middle">Lobby</text>
<text x="315" y="37" font-size="14" fill="#cbd5e1" text-anchor="middle">Leaderboard</text>
<text x="436" y="37" font-size="14" fill="#cbd5e1" text-anchor="middle">History</text>
<text x="1124" y="37" font-size="14" fill="#cbd5e1" text-anchor="middle">Profile</text>
<circle cx="1200" cy="32" r="16" fill="#334155"/>

<!-- TOP BAR: turn indicator and timer -->
<text x="64" y="84" font-size="11" letter-spacing="1" fill="#64748b">TURN INDICATOR</text>
<rect x="64" y="92" width="1152" height="64" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<rect x="88" y="108" width="180" height="32" rx="16" fill="#4f46e5"/>
<text x="178" y="129" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Your turn</text>

<text x="1000" y="84" font-size="11" letter-spacing="1" fill="#64748b">TIMER</text>
<rect x="1000" y="108" width="88" height="32" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
<text x="1044" y="129" font-size="16" font-weight="600" fill="#f59e0b" text-anchor="middle">0:24</text>
<rect x="1100" y="120" width="96" height="8" rx="4" fill="#1e293b"/>
<rect x="1100" y="120" width="78" height="8" rx="4" fill="#f59e0b"/>

<!-- LEFT: your player panel -->
<text x="64" y="176" font-size="11" letter-spacing="1" fill="#64748b">PLAYER PANEL (YOU)</text>
<rect x="64" y="184" width="240" height="600" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<circle cx="184" cy="248" r="40" fill="#4f46e5"/>
<text x="184" y="324" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">ada_l</text>
<text x="184" y="348" font-size="14" fill="#94a3b8" text-anchor="middle">Rating 1200</text>
<text x="88" y="404" font-size="14" fill="#cbd5e1">Your piece</text>
<rect x="224" y="388" width="24" height="24" rx="4" fill="#ef4444"/>
<rect x="88" y="720" width="192" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
<text x="184" y="745" font-size="14" fill="#cbd5e1" text-anchor="middle">Resign</text>

<!-- CENTRE: board slot -->
<text x="350" y="176" font-size="11" letter-spacing="1" fill="#64748b">BOARD</text>
<rect x="350" y="184" width="520" height="520" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
<text x="610" y="436" font-size="16" fill="#94a3b8" text-anchor="middle">BOARD SLOT – game-specific component</text>
<text x="610" y="462" font-size="16" fill="#94a3b8" text-anchor="middle">(tic-tac-toe / Connect Four / checkers)</text>
<text x="610" y="744" font-size="14" fill="#64748b" text-anchor="middle">Last move: opponent played column 4</text>

<!-- RIGHT TOP: opponent panel -->
<text x="916" y="176" font-size="11" letter-spacing="1" fill="#64748b">OPPONENT PANEL</text>
<rect x="916" y="184" width="300" height="240" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<circle cx="964" cy="232" r="32" fill="#334155"/>
<text x="1012" y="226" font-size="16" font-weight="600" fill="#f1f5f9">devon</text>
<text x="1012" y="248" font-size="14" fill="#94a3b8">Rating 1184</text>
<text x="940" y="300" font-size="14" fill="#cbd5e1">Their piece</text>
<rect x="1076" y="284" width="24" height="24" rx="4" fill="#f59e0b"/>
<circle cx="944" cy="352" r="5" fill="#22c55e"/>
<text x="956" y="357" font-size="14" fill="#94a3b8">Connected</text>

<!-- RIGHT BOTTOM: chat -->
<text x="916" y="448" font-size="11" letter-spacing="1" fill="#64748b">CHAT</text>
<rect x="916" y="456" width="300" height="328" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<rect x="932" y="476" width="220" height="40" rx="10" fill="#1e293b"/>
<text x="944" y="501" font-size="14" fill="#f1f5f9">devon: gg, good luck!</text>
<rect x="980" y="528" width="220" height="40" rx="10" fill="#4f46e5"/>
<text x="992" y="553" font-size="14" fill="#ffffff">you too!</text>
<rect x="932" y="580" width="220" height="40" rx="10" fill="#1e293b"/>
<text x="944" y="605" font-size="14" fill="#f1f5f9">devon: nice opening</text>
<rect x="932" y="724" width="160" height="40" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
<text x="946" y="749" font-size="14" fill="#64748b">Type a message…</text>
<rect x="1100" y="724" width="100" height="40" rx="8" fill="#4f46e5"/>
<text x="1150" y="749" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Send</text>
</svg>
