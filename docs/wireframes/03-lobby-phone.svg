<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Inter, system-ui, sans-serif">
<title>Arcade wireframe – Lobby (phone)</title>
<rect x="0" y="0" width="360" height="760" fill="#020617"/>

<!-- Compact header -->
<rect x="0" y="0" width="360" height="56" fill="#0f172a"/>
<line x1="0" y1="56" x2="360" y2="56" stroke="#1e293b" stroke-width="1"/>
<text x="16" y="35" font-size="18" font-weight="700" fill="#f1f5f9">Arcade</text>
<line x1="320" y1="22" x2="340" y2="22" stroke="#cbd5e1" stroke-width="2"/>
<line x1="320" y1="28" x2="340" y2="28" stroke="#cbd5e1" stroke-width="2"/>
<line x1="320" y1="34" x2="340" y2="34" stroke="#cbd5e1" stroke-width="2"/>

<text x="16" y="96" font-size="24" font-weight="600" fill="#f1f5f9">Lobby</text>

<!-- Horizontally scrolling chips (last chip runs off the right edge) -->
<rect x="16" y="112" width="56" height="32" rx="16" fill="#4f46e5"/>
<text x="44" y="133" font-size="14" fill="#ffffff" text-anchor="middle">All</text>
<rect x="80" y="112" width="110" height="32" rx="16" fill="none" stroke="#334155" stroke-width="1"/>
<text x="135" y="133" font-size="14" fill="#cbd5e1" text-anchor="middle">Tic-tac-toe</text>
<rect x="198" y="112" width="130" height="32" rx="16" fill="none" stroke="#334155" stroke-width="1"/>
<text x="263" y="133" font-size="14" fill="#cbd5e1" text-anchor="middle">Connect Four</text>
<rect x="336" y="112" width="100" height="32" rx="16" fill="none" stroke="#334155" stroke-width="1"/>
<text x="352" y="133" font-size="14" fill="#cbd5e1">Checkers</text>

<!-- Full-width create button -->
<rect x="16" y="160" width="328" height="40" rx="8" fill="#4f46e5"/>
<text x="180" y="185" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">+ Create room</text>

<!-- Room card 1: Waiting, Join -->
<rect x="16" y="216" width="328" height="96" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<text x="32" y="246" font-size="16" font-weight="600" fill="#f1f5f9">Tic-tac-toe</text>
<text x="32" y="268" font-size="14" fill="#94a3b8">Host: mira</text>
<circle cx="36" cy="289" r="4" fill="#22c55e"/>
<text x="46" y="294" font-size="14" fill="#cbd5e1">1/2 · Waiting</text>
<rect x="252" y="244" width="76" height="40" rx="8" fill="#4f46e5"/>
<text x="290" y="269" font-size="14" fill="#ffffff" text-anchor="middle">Join</text>

<!-- Room card 2: In game, Full -->
<rect x="16" y="324" width="328" height="96" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<text x="32" y="354" font-size="16" font-weight="600" fill="#f1f5f9">Connect Four</text>
<text x="32" y="376" font-size="14" fill="#94a3b8">Host: devon</text>
<circle cx="36" cy="397" r="4" fill="#f59e0b"/>
<text x="46" y="402" font-size="14" fill="#cbd5e1">2/2 · In game</text>
<g opacity="0.4">
<rect x="252" y="352" width="76" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
<text x="290" y="377" font-size="14" fill="#cbd5e1" text-anchor="middle">Full</text>
</g>

<!-- Room card 3: Waiting, Join -->
<rect x="16" y="432" width="328" height="96" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<text x="32" y="462" font-size="16" font-weight="600" fill="#f1f5f9">Checkers</text>
<text x="32" y="484" font-size="14" fill="#94a3b8">Host: sam_k</text>
<circle cx="36" cy="505" r="4" fill="#22c55e"/>
<text x="46" y="510" font-size="14" fill="#cbd5e1">1/2 · Waiting</text>
<rect x="252" y="460" width="76" height="40" rx="8" fill="#4f46e5"/>
<text x="290" y="485" font-size="14" fill="#ffffff" text-anchor="middle">Join</text>

<!-- Join by code -->
<text x="16" y="590" font-size="11" letter-spacing="1" fill="#64748b">JOIN BY CODE</text>
<rect x="16" y="600" width="236" height="40" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
<text x="32" y="625" font-size="14" fill="#64748b">Room code</text>
<rect x="260" y="600" width="84" height="40" rx="8" fill="#4f46e5"/>
<text x="302" y="625" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Join</text>
</svg>
