<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Inter, system-ui, sans-serif">
<title>Arcade wireframe – Match page (phone)</title>
<rect x="0" y="0" width="360" height="800" fill="#020617"/>

<!-- Compact header -->
<rect x="0" y="0" width="360" height="56" fill="#0f172a"/>
<line x1="0" y1="56" x2="360" y2="56" stroke="#1e293b" stroke-width="1"/>
<text x="16" y="35" font-size="18" font-weight="700" fill="#f1f5f9">Arcade</text>
<line x1="320" y1="22" x2="340" y2="22" stroke="#cbd5e1" stroke-width="2"/>
<line x1="320" y1="28" x2="340" y2="28" stroke="#cbd5e1" stroke-width="2"/>
<line x1="320" y1="34" x2="340" y2="34" stroke="#cbd5e1" stroke-width="2"/>

<!-- Opponent bar -->
<text x="16" y="76" font-size="11" letter-spacing="1" fill="#64748b">OPPONENT PANEL</text>
<rect x="16" y="84" width="328" height="56" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<circle cx="44" cy="112" r="18" fill="#334155"/>
<text x="72" y="108" font-size="16" font-weight="600" fill="#f1f5f9">devon</text>
<text x="72" y="130" font-size="14" fill="#94a3b8">Rating 1184</text>
<rect x="280" y="100" width="52" height="32" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
<text x="306" y="121" font-size="14" fill="#cbd5e1" text-anchor="middle">0:28</text>

<!-- Turn indicator -->
<text x="16" y="162" font-size="11" letter-spacing="1" fill="#64748b">TURN INDICATOR</text>
<rect x="90" y="170" width="180" height="32" rx="16" fill="#4f46e5"/>
<text x="180" y="191" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Your turn</text>

<!-- Board slot -->
<text x="16" y="226" font-size="11" letter-spacing="1" fill="#64748b">BOARD</text>
<rect x="16" y="236" width="328" height="328" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
<text x="180" y="394" font-size="16" fill="#94a3b8" text-anchor="middle">BOARD SLOT</text>
<text x="180" y="418" font-size="14" fill="#64748b" text-anchor="middle">game-specific component</text>
<text x="180" y="438" font-size="14" fill="#64748b" text-anchor="middle">(tic-tac-toe / Connect Four / checkers)</text>

<!-- Your bar -->
<text x="16" y="590" font-size="11" letter-spacing="1" fill="#64748b">PLAYER PANEL (YOU)</text>
<rect x="16" y="598" width="328" height="56" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
<circle cx="44" cy="626" r="18" fill="#4f46e5"/>
<text x="72" y="622" font-size="16" font-weight="600" fill="#f1f5f9">ada_l</text>
<text x="72" y="644" font-size="14" fill="#94a3b8">Rating 1200</text>
<rect x="280" y="612" width="52" height="32" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
<text x="306" y="633" font-size="14" fill="#f59e0b" text-anchor="middle">0:24</text>

<!-- Bottom actions -->
<rect x="16" y="688" width="160" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
<text x="96" y="713" font-size="14" fill="#cbd5e1" text-anchor="middle">Resign</text>
<rect x="184" y="688" width="160" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
<text x="264" y="713" font-size="14" fill="#cbd5e1" text-anchor="middle">Chat (2)</text>

<text x="16" y="752" font-size="14" fill="#64748b">Chat opens as a bottom sheet</text>
<text x="16" y="772" font-size="14" fill="#64748b">over the board</text>
</svg>
